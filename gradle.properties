# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# Configures 2GB of heap memory and forces UTF-8 encoding.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel project execution.
# Allows Gradle to execute tasks in parallel for decoupled modules, 
# significantly improving build speed for multi-module projects.
org.gradle.parallel=true

# Enable Configuration Cache.
# Caches the result of the configuration phase to skip it in subsequent builds 
# if build scripts haven't changed, reducing build startup time.
org.gradle.configuration-cache=true

# Set Kotlin code style.
# "official" enforces the official Kotlin style guide.
kotlin.code.style=official

# Enable Tooling API parallel support.
org.gradle.tooling.parallel=true
